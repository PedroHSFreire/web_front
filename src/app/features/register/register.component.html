<div class="container">
  <div class="features-side">
    <div class="logo-area">
      <div class="logo"><img src="assets/logolobo.svg" alt="ByteSave"></div>
      <div>
        <span class="brand-name">ByteSave</span>
        <p class="side-copy">Crie sua conta e comece agora.</p>
      </div>
    </div>
    <p class="features-note">Um cadastro simples para acessar seu painel de tarefas.</p>
  </div>
  <div class="auth-side">
    <span class="eyebrow">Cadastro</span>
    <h2 class="auth-title">Criar conta</h2>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label">NOME COMPLETO</label>
        <input type="text" [(ngModel)]="nome" name="nome" class="form-input" (input)="validateNome()">
        <p class="input-error" *ngIf="errors.nome">{{ errors.nome }}</p>
      </div>
      <div class="form-group">
        <label class="form-label">E-MAIL</label>
        <input type="email" [(ngModel)]="email" name="email" class="form-input" (input)="validateEmail()">
        <p class="input-error" *ngIf="errors.email">{{ errors.email }}</p>
      </div>
      <div class="form-group">
        <label class="form-label">SENHA</label>
        <input type="password" [(ngModel)]="senha" name="senha" class="form-input" (input)="validateSenha()">
        <p class="input-error" *ngIf="errors.senha">{{ errors.senha }}</p>
      </div>
      <div class="form-group">
        <label class="form-label">CONFIRMAR SENHA</label>
        <input type="password" [(ngModel)]="confirmSenha" name="confirmSenha" class="form-input" (input)="validateConfirm()">
        <p class="input-error" *ngIf="errors.confirm">{{ errors.confirm }}</p>
      </div>
      <button type="submit" class="btn-login" [disabled]="isLoading">{{ isLoading ? 'CRIANDO...' : 'CRIAR CONTA' }}</button>
    </form>
    <a routerLink="/login" class="btn-create">Voltar</a>
  </div>
</div>
